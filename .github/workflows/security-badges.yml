name: Security badges

# Keeps badges/<repo>.json current: each public repo's open Dependabot
# alerts as a shields.io endpoint badge (scripts/security-badges.mjs), which
# that repo's README shows. Commits only when a badge changed.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

# Pushing the badge files is all this workflow's own token does.
permissions:
  contents: write

concurrency:
  group: security-badges
  cancel-in-progress: false

jobs:
  badges:
    name: Update the badge files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Alerts need a token that can read them: a fine-grained token with
      # "Dependabot alerts: Read-only" on all repos, stored as a secret.
      - name: Count open alerts and write the badge files
        run: node scripts/security-badges.mjs
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

      # Staged first, so new and removed files count as changes too.
      - name: Commit the badge files if they changed
        run: |
          git add --all badges
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Security badges: update open Dependabot alert counts'
          git push
